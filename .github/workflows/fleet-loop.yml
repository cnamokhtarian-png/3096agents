# حلقهٔ خودکار ۲۴/۷ ناوگان (Autonomous Loop) — اجرای پیوستهٔ چرخهٔ واقعی.
#
# چه کاری می‌کند؟
#   هر ۱۵ دقیقه `/api/cron/tick?job=loop` را روی Production صدا می‌زند:
#     ۱) موتورهای زنده (آریا، بانتی‌هانتر، متخصص‌ها) را اسکن می‌کند
#     ۲) صف تأیید را «همیشه پر» نگه می‌دارد: برای هر کارمند کم‌کارت،
#        یک مأموریت تازه با کارت [✅]/[❌] در تلگرام می‌سازد
#     ۳) تصمیم‌های شما از تیک قبل را می‌شمارد و خلاصه را در تلگرام می‌فرستد
#
# چرا GitHub Actions؟ پلن Hobby ورسل اجازهٔ کرون بیش از روزی یک‌بار نمی‌دهد؛
# پس کرون روزانهٔ vercel.json فقط «ضربان پشتیبان» است و حلقهٔ اصلی اینجاست.
#
# پیش‌نیاز (یک‌بار): در GitHub → Settings → Secrets and variables → Actions
# یک سکرت به نام CRON_SECRET با همان مقدار CRON_SECRET در Vercel بسازید.
# بدون آن این حلقه 401 می‌گیرد و هیچ کاری نمی‌کند.
#
# اجرای دستی: تب Actions → «Fleet Loop» → Run workflow
#   job = loop   → یک تیک حلقهٔ خودکار (پیشنهادی)
#   job = full   → چرخهٔ کامل قدیمی (موتورها + صف + یادآوری + انقضا)
#   job = reports→ گزارش روزانه
#
# تنظیم فاصله: مقدار cron زیر را تغییر دهید (کمینهٔ عملی گیت‌هاب هر ۵ دقیقه است).
# خود حلقه هم فاصلهٔ داخلی (intervalMinutes) دارد؛ اگر می‌خواهید موتورها
# سبک‌تر اجرا شوند، از پنل → «حلقهٔ خودکار ۲۴/۷» گزینهٔ «اجرای موتورها در هر تیک»
# را خاموش کنید.

name: Fleet Loop (حلقه خودکار ۲۴/۷)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "نوع چرخه"
        required: false
        default: "loop"
        type: choice
        options:
          - loop
          - full
          - reports
          - queue

permissions: {}

concurrency:
  group: fleet-loop
  cancel-in-progress: false

jobs:
  tick:
    name: اجرای تیک حلقه روی Production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: تحریک چرخهٔ واقعی
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://freelance-agent-os.vercel.app
          JOB: ${{ inputs.job || 'loop' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::سکرت CRON_SECRET در GitHub Secrets تنظیم نشده است؛ حلقهٔ خودکار غیرفعال می‌ماند. راهنما: بالای همین فایل."
            exit 1
          fi
          echo "Triggering autonomous loop (job=$JOB) on $APP_URL ..."
          HTTP_CODE=$(curl -sS -m 280 -o /tmp/loop-resp.json -w "%{http_code}" \
            -X POST "$APP_URL/api/cron/tick" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"job\":\"$JOB\"}")
          echo "HTTP $HTTP_CODE"
          cat /tmp/loop-resp.json
          echo
          if [ "$HTTP_CODE" != "200" ] || ! grep -q '"ok":true' /tmp/loop-resp.json; then
            echo "::error::حلقهٔ خودکار موفق نبود (HTTP $HTTP_CODE)."
            exit 1
          fi
          echo "Autonomous loop tick completed successfully."
